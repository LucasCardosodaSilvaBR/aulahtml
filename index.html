<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula HTML</title>
    <link rel="stylesheet" href="estilo.css">


</head>

<body>
    <h2>Formulário</h2>
    <form method="post">
        <label for="nome"> Nome:</label><br>
        <input type="text" id="nome" name="nome" required><br>
        <label for="email"> E-mail:</label><br>
        <input type="email" id="email" name="email" required><br>
        <label for="senha"> Senha:</label><br>
        <input type="password" id="senha" name="senha" required><br>
        <label for="idade"> Idade:</label><br>
        <input type="number" min="18" max="20" id="idade" name="idade" required><br>
        <label for="idade">Idade (slider):</label><br>
        <input type="range" min="18" max="20" id="idade" name="idade" required><br>
        <label for="cor"> Cor:</label><br>
        <input type="color" id="cor" name="cor" required><br>
        <label for="data"> Data:</label><br>
        <input type="date" id="data" name="data" required><br>
        <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf" required pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"><br>

        <label for="idiomas"> Idiomas:</label><br>
        <input type="checkbox" id="idioma1" name="idiomas" value="portugues">
        <label for="idioma1">Português</label><br>
        <input type="checkbox" id="idioma2" name="idiomas" value="ingles">
        <label for="idioma2">Inglês</label><br>
        <input type="checkbox" id="idioma3" name="idiomas" value="espanhol">
        <label for="idioma3">Espanhol</label><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar"><br>
    </form>

    

</body>

</html>
