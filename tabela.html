<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Pão</td>
                <td>1</td>
                <td>7.50</td>
                <td>7.50</td>
            </tr>
            <tr>
                <td>Leite</td>
                <td>2</td>
                <td>3.50</td>
                <td>7.00</td>
            </tr>
             <tr>
                <td>Feijão</td>
                <td>4</td>
                <td>3.50</td>
                <td>14.00</td>
            </tr>
            <tr>
                <td>Arroz</td>
                <td>2</td>
                <td>4.00</td>
                <td>8.00</td>
            </tr>
        </tbody>

    </table>
    
</body>
</html>
