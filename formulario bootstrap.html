<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #c9cfd4;
            min-height: 100vh;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary>
        <div class="container-fluid">
            <a class="navbar-brand" href="#">ETE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Início</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Cadastro
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Pessoa</a></li>
                            <li><a class="dropdown-item" href="#">Idade</a></li>

                        </ul>
                    </li>
                </ul>

            </div>
        </div>
    </nav>
    <h1 class="text-start text-primary mt-2 ms-2">Cadastro de Clientes</h1>

    <div class="container">
        <form action="" class="border border-dark border-2 p-3 bg-light bg-primary rounded-3 height-100">
            <div class="row mt-3">
                <div class="col-12 col-md-4">
                    <label for="email" class="form-label fw-bold">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu email">
                </div>
                <div class="col-12 col-md-4">
                    <label for="endereco" class="form-label fw-bold">Endereço:</label>
                    <input type="text" class="form-control" id="endereco" placeholder="Digite seu endereço">
                </div>
                <div class="col-12 col-md-3">
                    <label for="cidade" class="form-label fw-bold">Cidade:</label>
                    <input type="text" class="form-control" id="cidade" placeholder="Digite sua cidade">
                </div>

                <div class="col-12 col-md-1">
                    <label for="numero" class="form-label fw-bold">Número:</label>
                    <input type="text" class="form-control" id="numero" placeholder="Digite seu número">
                </div>


                <div class="col-12 mt-3 text-center">
                    <button type="submit" class="btn btn-success">Enviar</button>
                </div>
                <div class="col-12 mt-3 text-center">
                    <button type="reset" class="btn btn-danger">Limpar</button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
