<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="formulario.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
    <header>
        <h1>Formulário</h1>
    </header>
    <div class="container">

        <section>
            <form method="post" autocomplete="off">
                <fieldset style="width: 500px;">
                    <legend>Dados Pessoais</legend>
                    <label class="label_texto" for="nome"> Nome:</label><br>
                    <input class="caixa_texto" type="text" id="nome" name="nome" required><i class="bi-person"></i><br>
                    <label class="label_texto" for="email"> E-mail:</label><br>
                    <input class="caixa_texto" type="email" id="email" name="email" required><i
                        class="bi-envelope"></i><br>
                    <label class="label_texto" for="senha"> Senha:</label><br>
                    <input class="caixa_texto" type="password" id="senha" name="senha" required><i
                        class="bi-lock"></i><br>
                    <label class="label_texto" for="cpf">CPF:</label><br>
                    <input class="caixa_texto" type="text" id="cpf" name="cpf" required
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        title="Digite o CPF no formato nnn.nnn.nnn-nn"><i class="bi-person-vcard"></i><br>

                    <br><label class="label_texto" for="estados"> Estados:</label>
                    <select id="estados" name="estados" required>
                        <option value="">Estado</option>
                        <option value="sao-paulo">São Paulo</option>
                        <option value="rio-de-janeiro">Rio de Janeiro</option>
                        <option value="brasilia">Distrito Federal</option>
                        <option value="salvador">Bahia</option>
                        <option value="fortaleza">Ceará</option>
                        <option value="belo-horizonte">Minas Gerais</option>
                        <option value="curitiba">Paraná</option>
                        <option value="recife">Pernambuco</option>
                        <option value="porto-alegre">Rio Grande do Sul</option>
                    </select><br>

                    <br><input class="enviar" type="submit" value="Enviar">
                    <input class="limpar" type="reset" value="Limpar"><br>

                </fieldset>
            </form>
        </section>

        <aside class="imagem">
            <img src="imagens/imagem-formulário2.png" alt="">
        </aside>



    </div>

    <footer>
        <p>&copy; 2026 Formulário. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
